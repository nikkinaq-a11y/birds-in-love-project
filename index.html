<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strut: A Courtship Dance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hud">
    <div class="hud-item">Score <b id="score">0</b></div>
    <div class="hud-item">Combo <b id="combo">0</b></div>
    <div class="hud-item affection">
      <span>Her interest</span>
      <div class="meter"><div id="affection-fill"></div></div>
    </div>
    <div class="hud-item">Round <b id="round">1</b>/3</div>
  </header>

  <main class="stage">
    <div class="sun"></div>
    <div class="hill hill-back"></div>
    <div class="hill hill-front"></div>

    <!-- Webcam + live model output -->
    <aside class="cam">
      <canvas id="cam-canvas" width="200" height="200"></canvas>
      <div id="bars" class="bars"></div>
    </aside>

    <div class="move-label">
      <div id="move-name"></div>
      <div id="beat-dots" class="beat-dots"></div>
    </div>

    <div id="rating" class="rating"></div>

    <!-- The player: mirrors whatever pose the model detects -->
    <div class="rooster-wrap">
      <svg id="rooster" viewBox="0 0 220 240" data-pose="idle" aria-label="Rooster">
        <g class="r-all">
          <g class="r-legs" stroke="#e8a317" stroke-width="6" stroke-linecap="round" fill="none">
            <path d="M100 176 L96 222 M96 222 L84 228 M96 222 L106 230"/>
            <path d="M124 176 L128 222 M128 222 L116 230 M128 222 L140 228"/>
          </g>
          <g class="r-body">
            <g class="r-tail">
              <path class="plume p1" d="M76 128 C42 108 22 58 36 28 C48 68 62 98 82 116 Z"/>
              <path class="plume p2" d="M74 132 C32 126 10 88 14 56 C32 94 54 114 80 124 Z"/>
              <path class="plume p3" d="M76 138 C36 148 12 128 6 102 C32 126 54 134 80 132 Z"/>
              <path class="plume p4" d="M80 124 C60 90 62 48 82 24 C80 64 86 94 92 114 Z"/>
            </g>
            <path class="r-wing-far" d="M100 112 C122 104 146 112 150 130 C138 146 110 148 94 136 C88 128 90 118 100 112 Z"/>
            <ellipse class="r-torso" cx="114" cy="142" rx="48" ry="42"/>
            <g class="r-head">
              <path class="r-neck" d="M120 116 C116 92 124 74 140 70 C154 72 160 90 152 116 Z"/>
              <g class="r-comb">
                <circle cx="134" cy="52" r="9"/>
                <circle cx="145" cy="47" r="10"/>
                <circle cx="156" cy="53" r="8"/>
              </g>
              <circle class="r-face" cx="148" cy="72" r="20"/>
              <circle cx="154" cy="67" r="3.6" fill="#222"/>
              <circle cx="155.2" cy="65.8" r="1.2" fill="#fff"/>
              <path class="r-wattle" d="M160 86 C157 100 166 106 169 95 C171 88 167 84 160 86 Z"/>
              <path class="r-beak-top" d="M164 70 L186 77 L164 80 Z"/>
              <path class="r-beak-bot" d="M164 80 L181 80 L164 86 Z"/>
            </g>
            <g class="r-wing">
              <path d="M98 124 C122 116 148 126 152 146 C140 164 110 166 92 152 C86 142 88 130 98 124 Z"/>
              <path class="r-wing-line" d="M106 146 C120 150 132 150 144 146"/>
              <path class="r-wing-line" d="M104 136 C118 140 130 140 142 136"/>
            </g>
          </g>
        </g>
      </svg>
    </div>

    <!-- The judge: her distance and mood are the feedback channel -->
    <div class="hen-wrap" id="hen-wrap">
      <svg id="hen" viewBox="0 0 180 200" data-mood="neutral" aria-label="Hen">
        <g class="h-all">
          <g stroke="#e8a317" stroke-width="5" stroke-linecap="round" fill="none">
            <path d="M80 160 L78 192 M78 192 L68 196 M78 192 L86 197"/>
            <path d="M102 160 L104 192 M104 192 L96 197 M104 192 L114 196"/>
          </g>
          <path class="h-tail" d="M128 108 C148 90 164 94 168 76 C172 102 160 124 132 130 Z"/>
          <ellipse class="h-body" cx="94" cy="128" rx="46" ry="38"/>
          <ellipse class="h-wing" cx="104" cy="130" rx="26" ry="17"/>
          <g class="h-head">
            <path class="h-neck" d="M76 118 C66 98 60 80 64 70 C76 62 86 74 90 96 Z"/>
            <circle cx="54" cy="52" r="6" fill="#e0352b"/>
            <circle cx="63" cy="54" r="5" fill="#e0352b"/>
            <circle class="h-face" cx="60" cy="72" r="17"/>
            <circle cx="53" cy="68" r="3" fill="#222"/>
            <circle cx="52.2" cy="67" r="1" fill="#fff"/>
            <ellipse class="h-blush" cx="61" cy="80" rx="5" ry="3"/>
            <path d="M44 72 L29 77 L44 81 Z" fill="#f2a516"/>
            <path d="M45 84 C42 92 48 94 50 88 Z" fill="#e0352b"/>
          </g>
        </g>
      </svg>
      <div class="nest" aria-hidden="true">🥚</div>
    </div>

    <div class="cue-track">
      <div id="cues" class="cues"></div>
      <div class="hit-line"></div>
    </div>
  </main>

  <div id="overlay" class="overlay">
    <div class="card">
      <h1>Strut</h1>
      <p class="lede">You are a rooster. She is watching.</p>
      <p>Like a bird of paradise on display, you have one routine to win her over: <b>Beak</b>, <b>Flap</b>, <b>Boogie</b>, <b>Clap</b>. Hit each move on the beat. Every round gets faster.</p>
      <p id="status" class="status"></p>
      <button id="start-btn">Turn on camera</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.6/dist/teachablemachine-pose.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
