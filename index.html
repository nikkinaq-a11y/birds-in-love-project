<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clearing Dance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Scene: everything inside is positioned in % of the background so it stays aligned at any window size -->
  <div class="scene">
    <img class="bg" src="assets/forest.jpg" alt="">

    <div class="female" id="female">
      <div class="female-hop"><img src="assets/female.png" alt="Female parotia"></div>
    </div>

    <div class="male" id="male" data-pose="idle">
      <div class="male-rig">
        <div class="wing wing-l">
          <div class="wing-inner">
            <img class="w-spread" src="assets/male-wing-spread.png" alt="">
            <img class="w-up" src="assets/male-wing-up.png" alt="">
          </div>
        </div>
        <div class="wing wing-r">
          <div class="wing-inner">
            <img class="w-spread" src="assets/male-wing-spread.png" alt="">
            <img class="w-up" src="assets/male-wing-up.png" alt="">
          </div>
        </div>
        <img class="legs" src="assets/male-legs.png" alt="">
        <img class="body" src="assets/male-body.png" alt="">
        <img class="head" src="assets/male-head.png" alt="">
      </div>
    </div>

    <div class="rating" id="rating"></div>
  </div>

  <!-- Webcam -->
  <div class="cam">
    <canvas id="cam-canvas" width="200" height="200"></canvas>
    <div id="debug" class="debug" hidden></div>
  </div>

  <div class="hud">
    <div>Score <b id="score">0</b></div>
    <div>Combo <b id="combo">0</b></div>
    <button class="pause-btn" id="pause-btn" aria-label="Pause" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
  </div>

  <div class="pause-screen" id="pause-screen" hidden>
    <h2>Paused</h2>
    <div class="pause-actions">
      <button id="resume-btn">Resume</button>
      <button id="restart-btn" class="secondary">Restart</button>
    </div>
  </div>

  <div class="message" id="message"></div>

  <div class="cue-track">
    <div class="cues" id="cues"></div>
    <div class="hit-line"></div>
  </div>

  <!-- Leaf curtains -->
  <div class="curtains" id="curtains">
    <div class="shade"></div>
    <div class="curtain curtain-l">
      <img class="leaf leaf-a" src="assets/leaf.png" alt="">
      <img class="leaf leaf-b" src="assets/leaf.png" alt="">
      <img class="leaf leaf-c" src="assets/leaf.png" alt="">
    </div>
    <div class="curtain curtain-r">
      <img class="leaf leaf-a" src="assets/leaf.png" alt="">
      <img class="leaf leaf-b" src="assets/leaf.png" alt="">
      <img class="leaf leaf-c" src="assets/leaf.png" alt="">
    </div>
    <div class="curtain-content" id="curtain-content" data-step="play">
      <div id="results" class="results" hidden></div>
      <!-- PLAY and the intro share one spot: the intro fades in where PLAY was -->
      <div class="slot">
        <button class="play" id="play-btn" aria-label="Play">
          <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46"/><path d="M40 30 L72 50 L40 70 Z"/></svg>
          <span id="play-label">PLAY</span>
        </button>
        <div class="intro" id="intro">
          <p class="caption">Woo all the lady birds with your dance moves! Successfully complete the chicken dance to bring your mate down from the branches above.</p>
          <button class="start-btn" id="start-btn">Start dancing</button>
        </div>
      </div>
      <p class="status" id="status"></p>
    </div>
  </div>

  <audio id="song" src="assets/chicken-dance.mp3" preload="auto"></audio>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.6/dist/teachablemachine-pose.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
